name: main APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Debug APK
        run: |
          # Kiểm tra nếu thiếu file gradle-wrapper.jar thì tự động tạo lại wrapper bằng Gradle hệ thống
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Gradle wrapper jar missing. Generating standard wrapper..."
            gradle wrapper
          fi

          # Tiến hành cấp quyền và chạy build bằng Gradle Wrapper
          if [ -f "./gradlew" ]; then
            echo "Building with Gradle Wrapper..."
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "Gradlew not found. Falling back to global Gradle..."
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
